name: CI

on:
  push:
    branches:
      - main
      - next
      - develop
  pull_request:
    branches:
      - main
      - next
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Lint, Types & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint (Strict Imports, Spacing, Complexity & Safety)
        run: pnpm lint

      - name: Run TypeScript Compiler Check
        run: pnpm typecheck

      - name: Verify Dead Code & Unused Exports (Knip)
        run: pnpm check:deadcode

      - name: Verify Code Duplication Limits (jscpd)
        run: pnpm check:duplication

      - name: Verify Build Pipeline
        run: pnpm build

      - name: Verify Package Exports (Publint)
        run: pnpm check:exports

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest Integration Tests
        run: pnpm test:int

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E Tests
        run: pnpm test:e2e

  # TEMPORARY: establishes the real minimum supported Payload version.
  # Remove this job once a floor is confirmed and peerDependencies/README/CLAUDE.md
  # are updated to match.
  payload-version-matrix-temp:
    name: Payload compat (${{ matrix.payload-version }})
    if: github.ref_name == 'test/payload-version-matrix' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        payload-version:
          - 3.77.0
          - 3.78.0
          - 3.79.0
          - 3.79.1
          - 3.80.0
          - 3.81.0
          - 3.82.0
          - 3.82.1
          - 3.83.0
          - 3.84.0
          - 3.84.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Override installed Payload version
        run: |
          pnpm add -D -w \
            payload@${{ matrix.payload-version }} \
            @payloadcms/db-mongodb@${{ matrix.payload-version }} \
            @payloadcms/db-postgres@${{ matrix.payload-version }} \
            @payloadcms/db-sqlite@${{ matrix.payload-version }} \
            @payloadcms/next@${{ matrix.payload-version }} \
            @payloadcms/richtext-lexical@${{ matrix.payload-version }} \
            @payloadcms/ui@${{ matrix.payload-version }}

      - name: Run Vitest Integration Tests
        run: pnpm test:int
